<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Home page of Joelle Cook's art portfolio.">
  <title>Joelle Cook — Home</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="preconnect" href="https://sites.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#212121; --muted:#5f7d8c; --paper:#fff; --soft:#f7f7f7; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Open Sans",sans-serif; line-height:1.7; }
    .site-header { background:var(--soft); padding:30px clamp(20px,6vw,80px); border-bottom:1px solid #e5e5e5; }
    .site-name { margin:0; font:400 clamp(28px,4vw,42px)/1.2 "Oswald",sans-serif; letter-spacing:.04em; }
    main { max-width:1200px; margin:0 auto; padding:0 clamp(18px,4vw,48px) 70px; }
    .page-title { margin:48px 0 10px; font:400 clamp(34px,5vw,54px)/1.15 "Oswald",sans-serif; }
    .intro { color:var(--muted); margin:0 0 36px; font:400 20px/1.4 "Open Sans",sans-serif; }
    .art-section { padding:28px 0 42px; border-bottom:1px solid #e8e8e8; }
    .section-copy { max-width:850px; margin:0 auto 24px; white-space:normal; }
    .art-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:22px; align-items:start; }
    figure { margin:0; background:#f7f7f7; }
    /* figure img { display:block; width:100%; height:auto; max-height:680px; object-fit:contain; } */
    footer { background:var(--soft); text-align:center; padding:28px 18px; font-size:13px; color:#555; }
    @media (max-width:600px) {
      .site-header { padding:24px 18px; }
      .site-nav { gap:8px 16px; }
      .art-grid { grid-template-columns:1fr; }
      .art-section { padding:22px 0 30px; }
    }
    
/* Header layout */
.site-header {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 30px clamp(20px, 6vw, 80px);
  background: var(--soft);
  border-bottom: 1px solid #e5e5e5;
}

.logo-container {
  flex-shrink: 0;
}

.site-name {
  margin: 0;
}

/* Main navigation */
.site-nav {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  width: 100%;
  min-width: 0;
  gap: 20px;
  margin-top: 18px;
  position: relative;
}

.nav-links {
  display: flex;
  align-items: center;
  flex: 0 1 auto;
  min-width: 0;
  flex-wrap: nowrap;
  gap: 24px;
  overflow: visible;
}

.nav-links a,
.more-button {
  color: var(--ink);
  text-decoration: none;
  font: 400 16px "Oswald", sans-serif;
  white-space: nowrap;
  flex-shrink: 0;
}

.site-nav a:hover,
.more-button:hover {
  color: var(--muted);
}

/* More button */
.more-menu {
  position: relative;
  display: block;
  flex: 0 0 auto;
  visibility: hidden;
}

.more-menu.active {
  visibility: visible;
}

.more-button {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}

.dropdown-arrow {
  font-size: 10px;
  margin-left: 3px;
}

/* Dropdown */
.more-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 170px;
  max-height: 70vh;
  overflow-y: auto;
  background: var(--paper);
  border: 1px solid #e5e5e5;
  box-shadow: 0 4px 10px rgba(0,0,0,.12);
  z-index: 1000;
  padding: 8px 0;
}

.more-menu.open .more-dropdown {
  display: flex;
  flex-direction: column;
}

.more-dropdown a {
  display: block;
  padding: 8px 16px;
}

.more-dropdown a:hover {
  background: var(--soft);
}

@media (max-width: 600px) {
  .site-header {
    padding: 24px 18px;
  }

  .nav-links {
    gap: 16px;
  }

  .site-nav {
    gap: 12px;
  }

  .art-grid {
    grid-template-columns: 1fr;
  }

  .art-section {
    padding: 22px 0 30px;
  }
}

  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo-container">
    <a href="/joelle/homepage.html">
      <img src="/Kendall.png" alt="testing" width="50" height="50">
    </a>
  </div>
    <h1 class="site-name">Joelle Cook</h1>
    <nav class="site-nav" aria-label="Main navigation">
  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#printmaking">Printmaking</a>
    <a href="#">Digital Work</a>
    <a href="#">Installations</a>
    <a href="#">Ceramics</a>
    <a href="#">Exhibitions</a>
    <a href="#">About</a>
    <a href="#">CV</a>
  </div>

  <div class="more-menu">
    <button class="more-button" type="button"
            aria-expanded="false" aria-haspopup="true">
      More <span class="dropdown-arrow">▼</span>
    </button>

    <div class="more-dropdown">
      <!-- Overflowing navigation links will appear here -->
    </div>
  </div>
</nav>
     
  </header>
  <span class="C9DxTc " style="color: #000000; font-family: 'Open Sans', Arial; font-size: 12.0pt; font-weight: 400; vertical-align: baseline;">© 2026 Joelle Cook. All Rights Reserved. </span>
<span class="C9DxTc " style="color: #000000; font-family: 'Open Sans', Arial; font-size: 12.0pt; font-weight: 400; vertical-align: baseline;">Website Development by Kendall Leonard.</span>
  <span class="C9DxTc " style="color: #000000; font-family: 'Open Sans', Arial; font-size: 12.0pt; font-variant: normal; font-weight: 400; vertical-align: baseline;">This work may not be used to train AI.</span>

  
 
<script>

const nav = document.querySelector(".site-nav");
const navLinks = document.querySelector(".nav-links");
const moreMenu = document.querySelector(".more-menu");
const moreDropdown = document.querySelector(".more-dropdown");
const moreButton = document.querySelector(".more-button");

// Save the original links in their original order
const originalLinks = Array.from(navLinks.children);

function updateNavigation() {

  // Restore all links before recalculating
  originalLinks.forEach(link => {
    navLinks.appendChild(link);
  });

  moreMenu.classList.remove("active", "open");
  moreButton.setAttribute("aria-expanded", "false");

  // Measure available space
  const navWidth = nav.clientWidth;

  const navGap = parseFloat(
    getComputedStyle(nav).columnGap
  ) || 0;

  const linkGap = parseFloat(
    getComputedStyle(navLinks).columnGap
  ) || 0;

  const moreWidth = moreMenu.getBoundingClientRect().width;

  // Measure the actual width of all remaining links
  function calculateWidth() {

    let total = 0;

    Array.from(navLinks.children).forEach(link => {
      total += link.getBoundingClientRect().width;
    });

    total += Math.max(
      0,
      navLinks.children.length - 1
    ) * linkGap;

    return total;
  }

  // First check whether all links fit without More
  if (calculateWidth() <= navWidth) {
    return;
  }

  // Move entire links into More until everything fits
  while (
    navLinks.children.length > 1 &&
    calculateWidth() + navGap + moreWidth > navWidth
  ) {

    const lastLink = navLinks.lastElementChild;

    moreDropdown.prepend(lastLink);
  }

  // Show More
  if (moreDropdown.children.length > 0) {
    moreMenu.classList.add("active");
  }
}

// Open and close dropdown
moreButton.addEventListener("click", event => {

  event.stopPropagation();

  const isOpen = moreMenu.classList.toggle("open");

  moreButton.setAttribute("aria-expanded", isOpen);

});

// Close dropdown when clicking elsewhere
document.addEventListener("click", event => {

  if (!moreMenu.contains(event.target)) {
    moreMenu.classList.remove("open");
    moreButton.setAttribute("aria-expanded", "false");
  }

});

// Watch navigation width changes
const navObserver = new ResizeObserver(() => {
  updateNavigation();
});

navObserver.observe(nav);

// Recalculate after fonts load
if (document.fonts) {
  document.fonts.ready.then(updateNavigation);
}

// Initial calculation
window.addEventListener("load", updateNavigation);
updateNavigation();
</script>


</body>
</html>
